[workspace]
members = ["crates/analyzer"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
capstone = { version = "0.14", default-features = false, features = ["std", "full", "arch_riscv"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
goblin = "0.10"
hex = "0.4"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3.20"
tokio = { version = "1.47", features = ["fs", "macros", "rt-multi-thread", "time"] }
url = "2.5"
