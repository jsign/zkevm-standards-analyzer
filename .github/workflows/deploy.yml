name: Analyze and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.97.1
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Test analyzer and schema contract
        run: |
          cargo test --locked --workspace
          cargo run --quiet --locked -p zkevm-analyzer -- schema --output /tmp/report.schema.json
          cmp web/src/report.schema.json /tmp/report.schema.json
      - name: Analyze the latest published release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          mkdir -p web/public/data
          cargo run --release --locked -p zkevm-analyzer -- analyze \
            --release latest \
            --standards-ref main \
            --rules rules/standards.yml \
            --output web/public/data/report.json
      - name: Upload production report
        uses: actions/upload-artifact@v6
        with:
          name: report-${{ github.run_id }}
          path: web/public/data/report.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build dashboard
        working-directory: web
        run: |
          npm ci
          npm test
          npm run validate:report
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
